<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角色数据查询器 - 本地双击秒开版</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
.tag {
  padding: 0.125rem 0.5rem;
  border-radius: 0.25rem;
  font-size: 0.75rem;
  color: white;
  margin-right: 0.25rem;
  margin-bottom: 0.25rem;
  display: inline-block;
}
.tag-race { background: #6366f1; }
.tag-class { background: #ea580c; }
.tag-element { background: #0284c7; }
.tag-map { background: #16a34a; }
.tag-alien { background: #dc2626; }
.section-title {
  font-size: 1.125rem;
  font-weight: bold;
  border-left: 4px solid #3b82f6;
  padding-left: 0.5rem;
  margin: 0.75rem 0;
  color: #1f2937;
}
.skill-card, .talent-card {
  background: #f9fafb;
  padding: 0.75rem;
  border-radius: 0.375rem;
  border: 1px solid #e5e7eb;
  margin-bottom: 0.5rem;
}
.init-box {
  border: 3px dashed #3b82f6;
  background-color: #f0f7ff;
  cursor: pointer;
  transition: all 0.2s ease;
}
.init-box:hover {
  background-color: #e0f2fe;
}
</style>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8">
<div class="max-w-5xl mx-auto">
  <h1 class="text-2xl md:text-3xl font-bold text-center mb-6 text-gray-900">角色完整数据查询器</h1>

  <div class="bg-white rounded-lg shadow p-6 mb-6" id="setupZone">
    <div class="init-box rounded-xl p-8 text-center" id="dropZone">
      <svg class="mx-auto h-12 w-12 text-blue-500 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12" />
      </svg>
      <span class="text-gray-700 font-medium block text-lg">本地环境双击打开限制，需要完成一次激活</span>
      <span class="text-blue-600 underline block mt-2 font-bold">点击这里，全选本地 src/assets/ 下的 5 个 json 文件导入</span>
      <input type="file" accept=".json" id="fileBatchInput" multiple class="hidden">
    </div>
  </div>

  <div class="bg-white rounded-lg shadow p-4 mb-6 hidden" id="statusPanel">
    <div class="flex items-center justify-between flex-wrap gap-2">
      <span id="loadTip" class="text-sm font-medium text-amber-600">等待导入数据...</span>
      <button id="clearBtn" class="text-xs text-red-500 underline hover:text-red-700">清除缓存数据</button>
    </div>
  </div>

  <div class="bg-white rounded-lg shadow p-4 mb-6 hidden" id="searchWrap">
    <div class="flex flex-wrap gap-3 items-end">
      <div class="flex-1 min-w-[220px]">
        <label class="block text-sm text-gray-600 mb-1">搜索关键词 / 角色ID</label>
        <input id="searchInput" type="text" class="w-full border rounded px-3 py-2 outline-blue-400" placeholder="输入角色ID/角色名/异化[皮肤]全名">
      </div>
      <div class="w-44">
        <label class="block text-sm text-gray-600 mb-1">搜索模式</label>
        <select id="searchMode" class="w-full border rounded px-3 py-2">
          <option value="id">ID精确查询</option>
          <option value="exactName">名称精确匹配</option>
          <option value="fuzzyName">名称模糊单条</option>
          <option value="keyword">关键词批量搜索</option>
        </select>
      </div>
      <button id="searchBtn" class="bg-blue-600 text-white px-5 py-2 rounded hover:bg-blue-700 transition">开始查询</button>
    </div>
  </div>

  <div id="tipText" class="mb-4 text-gray-600 hidden"></div>

  <div id="resultContainer"></div>
</div>

<script>
const setupZone = document.getElementById('setupZone');
const dropZone = document.getElementById('dropZone');
const fileBatchInput = document.getElementById('fileBatchInput');
const statusPanel = document.getElementById('statusPanel');
const loadTip = document.getElementById('loadTip');
const searchWrap = document.getElementById('searchWrap');
const clearBtn = document.getElementById('clearBtn');

let datasets = { roleList: [], supportList: [], skillList: [], talentList: [], relicList: [] };

// 自动检测并从 localStorage 还原上次的数据（彻底实现后续打开“免导入”）
window.addEventListener('DOMContentLoaded', () => {
  try {
    const cached = localStorage.getItem('game_datasets');
    if (cached) {
      datasets = JSON.parse(cached);
      if (datasets.roleList && datasets.roleList.length > 0) {
        showSearchConsole(`本地数据自动恢复成功！已装载 ${datasets.roleList.length} 个角色。`);
      }
    }
  } catch(e) {
    console.log("读取本地持久化数据失败", e);
  }
});

dropZone.addEventListener('click', () => fileBatchInput.click());
fileBatchInput.addEventListener('change', (e) => { if (e.target.files.length > 0) handleBatchFiles(e.target.files); });

function extractDataArray(jsonData) {
  if (!jsonData) return [];
  if (Array.isArray(jsonData)) return jsonData;
  if (jsonData.DataTable && Array.isArray(jsonData.DataTable)) return jsonData.DataTable;
  return [];
}

function detectTableType(obj, fileName) {
  const nameInJson = obj?.m_Name || '';
  const fName = fileName.toLowerCase();
  if (nameInJson === 'RoleDataTable' || fName.includes('role')) return 'roleList';
  if (nameInJson === 'SubSkillDataTable' || fName.includes('subskill')) return 'supportList';
  if (nameInJson === 'UniqueDataTable' || fName.includes('unique')) return 'skillList';
  if (nameInJson === 'TalentDataTable' || fName.includes('talent')) return 'talentList';
  if (nameInJson === 'RelicsDataTable' || fName.includes('relics')) return 'relicList';
  return null;
}

async function handleBatchFiles(files) {
  let loadedCount = 0;
  for (let file of files) {
    try {
      const text = await file.text();
      const json = JSON.parse(text);
      const targetType = detectTableType(json, file.name);
      if (targetType) {
        datasets[targetType] = extractDataArray(json);
        loadedCount++;
      }
    } catch (err) {
      console.error(err);
    }
  }

  if (datasets.roleList.length > 0) {
    // 写入本地缓存，这样你下次直接双击打开 html，就再也不用导入了！
    try {
      localStorage.setItem('game_datasets', JSON.stringify(datasets));
    } catch(e) {
       console.warn("数据量过大，无法写入本地缓存，下次打开需重新全选拖入。");
    }
    showSearchConsole(`数据全部装载成功！共识别出 ${loadedCount} 个有效表，包含 ${datasets.roleList.length} 个角色数据。`);
  } else {
    alert("未能成功识别到有效的角色主表(RoleDataTable.json)，请确认选中的文件是否正确！");
  }
}

function showSearchConsole(msg) {
  setupZone.classList.add('hidden');
  statusPanel.classList.remove('hidden');
  searchWrap.classList.remove('hidden');
  loadTip.textContent = msg;
  loadTip.className = "text-sm font-medium text-green-600";
}

clearBtn.addEventListener('click', () => {
  localStorage.removeItem('game_datasets');
  location.reload();
});

// ===================== 原版业务逻辑 =====================
function splitIdName(str = '') {
  if (!str) return { id: '', name: '' }
  const [id, name = ''] = str.split(',')
  return { id: id.trim(), name: name.trim() }
}
function isAlienRole(roleId = '') { return roleId.includes('_') }
function formatRoleDisplayName(name = '', skinName = '') { return skinName ? `[${skinName}]${name}` : name }
function createMapById(list = [], keyField = 'IDs') {
  const map = new Map(); list.forEach(item => { if (item[keyField]) map.set(item[keyField], item) }); return map;
}
function replacePlaceholders(text = '', values = []) {
  return text.replace(/\{(\d+)\}/g, (match, idx) => {
    const num = Number(idx); return values[num] !== undefined ? values[num] : match;
  });
}
function buildBaseInfo(raw = {}) {
  const raceInfo = splitIdName(raw.Race); const normalAttackInfo = splitIdName(raw.NormalAttack); const displayName = formatRoleDisplayName(raw.Name, raw.SkinName);
  return {
    id: raw.IDs ?? '', name: raw.Name ?? '未知角色', displayName, skinName: raw.SkinName ?? '', isAlien: isAlienRole(raw.IDs), step: raw.Step ?? '',
    type: raw.Type ?? '', class: raw.Class ?? '', element: raw.Element ?? '', map: raw.Map ?? '', race: raceInfo, normalAttack: normalAttackInfo,
    source: raw.Source ?? '', background: raw.Background ?? '', characterRole: raw.CharacterRole ?? '',
    tags: [raw.Type ?? '', raw.Class ?? '', raw.Element ?? '', raw.Map ?? ''].filter(Boolean), filterTags: raw.FilterTags ? raw.FilterTags.split(',') : []
  }
}
function buildSupportSkills(raw = {}, supportMap = new Map()) {
  const fill = (info, type, star) => {
    const r = supportMap.get(info.id) || {}; const v = [r.Value0, r.Value1, r.Value2];
    return { id: info.id, name: info.name || r.Name || '', type, star, icon: r.Icon ?? '', description: r.Description ?? '', formattedDesc: replacePlaceholders(r.Description, v), value0: r.Value0 ?? 0, value1: r.Value1 ?? 0, value2: r.Value2 ?? 0, filterTags: r.FilterTags ? r.FilterTags.split(',') : [] }
  };
  return { characteristic: fill(splitIdName(raw.Characteristic), '性格', 3), subClass: fill(splitIdName(raw.SubClass), '称号', 4), feature: fill(splitIdName(raw.Feature), '特性', 5) }
}
function buildActiveSkills(roleId = '', skillList = []) {
  return skillList.filter(s => s.IDs === roleId).map(s => {
    return { id: s.IDs ?? '', name: s.Name ?? '', skillType: s.SkillType ?? '', targetType: s.TargetType ?? '', maxTarget: s.MaxTarget ?? 0, times: s.Times ?? 1, description: s.Description ?? '', formattedDesc: replacePlaceholders(s.Description, [, s.Times, s.Value, s.StatusLayer, s.ExtraValue1, s.ExtraValue2, s.ExtraValue3]), positiveTags: s.PositiveTags ? s.PositiveTags.split(',') : [], negativeTags: s.NegativeTags ? s.NegativeTags.split(',') : [] }
  });
}
function buildTalents(baseInfo = {}, talentList = []) {
  const res = { exclusive: [], race: [], class: [], element: [], common: [] };
  talentList.forEach(t => {
    t.formattedEffect = replacePlaceholders(t.Effect, [t.Value0, t.Value1, t.Value2]);
    if (t.SpecifyRoleIDs === baseInfo.id) { res.exclusive.push(t); return; }
    if (t.SpecifyRoleIDs) return;
    if (t.Race && t.Race === baseInfo.race.name) res.race.push(t);
    if (t.Class && t.Class === baseInfo.class) res.class.push(t);
    if (t.Element && t.Element === baseInfo.element) res.element.push(t);
    if (!t.Race && !t.Class && !t.Element) res.common.push(t);
  });
  return res;
}
function renderCharacterCard(char) {
  const tags = char.tags.map((t,i)=>`<span class="tag ${['tag-race','tag-class','tag-element','tag-map'][i]||''}">${t}</span>`).join('');
  const supports = [char.supportSkills.characteristic, char.supportSkills.subClass, char.supportSkills.feature].map(s => `
    <div class="skill-card">
      <div class="font-bold">${s.type} · ${s.name} <span class="text-amber-500">${s.star}星</span></div>
      <div class="text-sm text-green-600 mt-1">效果：${s.formattedDesc}</div>
    </div>
  `).join('');
  const actives = char.activeSkills.length ? char.activeSkills.map(s => `
    <div class="skill-card">
      <div class="font-bold">${s.name} <span class="text-blue-500">${s.skillType}</span></div>
      <div class="text-sm text-green-600 mt-1">效果：${s.formattedDesc}</div>
    </div>
  `).join('') : '<div class="text-gray-400">无专属主动技能</div>';
  const renderT = (title, list) => list.length ? `<div><div class="font-semibold text-gray-700 my-1">${title}</div>` + list.map(t=>`<div class="talent-card"><div class="font-bold">${t.Name}</div><div class="text-green-600">${t.formattedEffect}</div></div>`).join('') + `</div>` : '';
  const talents = [renderT('专属天赋', char.talents.exclusive), renderT('种族天赋', char.talents.race), renderT('职业天赋', char.talents.class), renderT('属性天赋', char.talents.element), renderT('通用天赋', char.talents.common)].join('') || '<div class="text-gray-400">无匹配天赋</div>';
  const stories = char.relics.length ? char.relics.map(i=>`<div class="border-l-2 border-gray-300 pl-3 py-1 my-2"><div class="font-semibold">${i.Name??'无名心得'}</div><div class="text-gray-600 text-sm">${i.Effect??''}</div></div>`).join('') : '<div class="text-gray-400">暂无角色心得</div>';

  return `<div class="bg-white rounded-lg shadow-md p-5 mb-6">
    <div class="border-b pb-4 mb-4">
      <h2 class="text-xl font-bold text-gray-900">${char.displayName} ${char.isAlien?'<span class="tag tag-alien">异化</span>':''} <span class="tag bg-yellow-500">${char.step}</span></h2>
      <div class="text-xs text-gray-500 mt-1">ID: ${char.id} | 背景: ${char.background}</div><div class="mt-2">${tags}</div>
    </div>
    <h3 class="section-title">支援技能</h3>${supports}<h3 class="section-title">主动技能</h3>${actives}<h3 class="section-title">天赋列表</h3>${talents}<h3 class="section-title">角色心得</h3>${stories}
  </div>`
}

// 搜索绑定
const searchInput = document.getElementById('searchInput'); const searchMode = document.getElementById('searchMode'); const searchBtn = document.getElementById('searchBtn'); const resultContainer = document.getElementById('resultContainer'); const tipText = document.getElementById('tipText');
searchBtn.addEventListener('click', () => {
  const kw = searchInput.value.trim(); if(!kw) return;
  let list = [];
  if (searchMode.value === 'id') {
    const c = datasets.roleList.find(i=>i.IDs===kw); if(c) list=[buildFull(c)];
  } else if (searchMode.value === 'exactName') {
    const c = datasets.roleList.find(i=>i.Name===kw||formatRoleDisplayName(i.Name,i.SkinName)===kw); if(c) list=[buildFull(c)];
  } else {
    list = datasets.roleList.filter(i=>i.Name?.includes(kw)||formatRoleDisplayName(i.Name,i.SkinName).includes(kw)).map(i=>buildFull(i));
    if(searchMode.value === 'fuzzyName' && list.length) list = [list[0]];
  }
  tipText.className = "mb-4 text-gray-600 block"; tipText.textContent = list.length ? `找到 ${list.length} 条数据` : '未找到匹配角色';
  resultContainer.innerHTML = list.map(c=>renderCharacterCard(c)).join('');
});
function buildFull(raw) {
  const base = buildBaseInfo(raw); return { ...base, supportSkills: buildSupportSkills(raw, createMapById(datasets.supportList)), activeSkills: buildActiveSkills(base.id, datasets.skillList), talents: buildTalents(base, datasets.talentList), relics: datasets.relicList.filter(r=>r.SpecifyRoleIDs===base.id) }
}
searchInput.addEventListener('keydown', e=>e.key === 'Enter' && searchBtn.click());
</script>
</body>
</html>
